PygmentsCodeFences: true
PygmentsStyle: "monokai"
baseurl: "https://muit.xyz"
locale: "en-us"
paginate: 10
theme: "hello-friend-ng"
readOtherPosts: "Read other posts"

title: "Miguel Fernández Arce"
subtitle: "Game systems programmer"
copyright: '<a href="https://github.com/muit" rel="noopener">Miguel Fernandez Arce</a>'

enableGitInfo: false # Enabled git commit info and link in posts

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: false

menu:
  main:
    - identifier: "about"
      name: "About"
      url: "/pages/about"
      weight: 1
    # - identifier: "voice"
    #   name: "Voice"
    #   url: "/pages/voice"
    #   weight: 2
    - identifier: "posts"
      name: "Posts"
      url: "/posts"
      weight: 3
    - name: "GitHub"
      url: "https://github.com/muit"
      weight: 4

params:
  dateform: "Jan 2, 2006"
  dateformNum: "2006-01-02"
  dateformNumTime: "2006-01-02"
  dateformShort: "Jan 2"
  defaultTheme: "dark"
  description: "Muit's portfolio & blog"
  disableReadOtherPosts: false
  enableSharingButtons: true
  homeSubtitle: "Game-Systems programmer"
  images: [""]
  justifyContent: true
  keywords: "muitxer, homepage, blog, portfolio, unreal engine, C++, Rust, piperift"

  logo:
    logoHomeLink: "/"
    logoText: "Muit"

  enableThemeToggle: true
  
  footer:
    trademark: 2026
    rss: true
    copyright: true
    author: false
    topText: 
    bottomText:
      - "Powered by <a href=\"http://gohugo.io\">Hugo</a>"
      - "<a href=\"https://piperift.com\">Piperift</a>"

  #commento:
  #  url: "https://comments.piperift.com/js/commento.js"

  social:
    - name: "resume"
      url: "https://www.linkedin.com/in/muitxer/"
      icon: "address-card"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/muitxer/"
    - name: "github"
      url: "https://github.com/muit"
    - name: "mastodon"
      url: "https://mastodon.social/@muit"
    - name: "email"
      url: "mailto:muit@piperift.com"

  gitUrl: "https://github.com/muit/muit.github.io/commit/"

permalinks:
  posts: "/posts/:year/:month/:title/"

taxonomies:
  category: "blog"
  series: "series"
  tag: "tags"

languages:
  en:
    weight: 1
  es:
    weight: 2
    params:
      subtitle: "Programador de sistemas de juego"
      homeSubtitle: "Programador de sistemas de juego"
      menu:
        main:
          - identifier: "about"
            name: "Sobre mí"
            url: "/pages/about"
            weight: 1
          # - identifier: "voice"
          #   name: "Doblaje"
          #   url: "/pages/voice"
          #   weight: 2
          - identifier: "posts"
            name: "Posts"
            url: "../posts"
            weight: 3
          - name: "GitHub"
            url: "https://github.com/muit"
            weight: 4
